version: 1
domain: linux

rules:
  - id: linux.storage.001
    title: Forecast from the time series, not from the percentage
    applies_to: {components: [linux, mongodb, kubernetes], categories: [disk_pressure]}
    rationale: >
      80% and growing 3%/hour is more urgent than 95% and flat. Use
      predict_linear(node_filesystem_avail_bytes[6h], 4*3600) or deriv() over a
      window long enough to smooth spikes.
    required_context: [filesystem_available_bytes, filesystem_size_bytes, growth_rate_bytes_per_hour]
    checks:
      - "PromQL: predict_linear(node_filesystem_avail_bytes{mountpoint=\"...\"}[6h], 4*3600) < 0"
      - Check if growth is steady, accelerating or a one-off spike.
      - "Compare with last week: avail_bytes offset 1w; seasonal growth (month-end jobs, campaigns) is not an anomaly."

  - id: linux.storage.002
    title: Inode exhaustion is a different incident
    applies_to: {components: [linux, kubernetes], categories: [inode_exhaustion]}
    rationale: >
      "No space left on device" with free bytes means no free inodes. Adding bytes
      may not help (ext4 fixes the inode ratio at mkfs time). The cause is millions
      of small files: sessions, cache, mail queues, container layers, temp files.
    required_context: [inodes_free_pct]
    checks:
      - "df -i to confirm inode usage per mount"
      - "find /path -xdev -type f | cut -d/ -f2-4 | sort | uniq -c | sort -rn | head to find directories with most files"
    constraints:
      - Do not propose disk expansion as the main fix for inode exhaustion.

  - id: linux.storage.003
    title: Deleted files still held open keep their space
    applies_to: {components: [linux], categories: [disk_pressure]}
    rationale: >
      If df shows much more used space than du, a process still holds deleted
      files (classic: a log removed with rm instead of rotated). Space returns only
      when the process closes the file. Restarting a production process needs approval.
    checks:
      - "lsof +L1 or lsof -nP | grep '(deleted)' to find held files and their PIDs"
      - "Compare df -h and du -xsh on the same mount"
      - Before restarting the holder, check who depends on that process (impact of the restart vs impact of the full disk).
    constraints:
      - "Prefer truncating via /proc/<pid>/fd/<n> or a graceful reload (logrotate copytruncate / SIGHUP) over a restart; both need approval on prod."
    dangerous_actions:
      - {label: "restart/kill process", pattern: '\b(kill|pkill|killall)\b|systemctl\s+restart|service\s+\S+\s+restart'}

  - id: linux.storage.004
    title: Logs are the usual suspect, rotate instead of delete
    applies_to: {components: [linux], categories: [disk_pressure]}
    rationale: >
      Sudden growth on /var after a deploy is often debug logging or a crash loop.
      Deleting an active log file does not free space (see linux.storage.003).
    checks:
      - "du -xh --max-depth=2 /var | sort -h | tail"
      - Check logrotate config and last run; check app log level changes in the last release.
      - "journalctl --disk-usage"
    constraints:
      - "Safe-ish space wins: journalctl --vacuum-size, compressing rotated logs, logrotate -f. Still confirm on prod."

  - id: linux.storage.005
    title: Reserved blocks are not free space to burn
    applies_to: {components: [linux], categories: [disk_pressure]}
    rationale: >
      ext4 reserves ~5% for root. Dropping it with tune2fs -m 0 gives instant space
      but removes the last safety margin for system daemons. Emergency only, with approval.
    dangerous_actions:
      - {label: "remove reserved blocks", pattern: 'tune2fs\s+-m'}

  - id: linux.storage.006
    title: Never clean up inside database or broker data directories
    applies_to: {components: [linux, mongodb, kubernetes], categories: [disk_pressure]}
    rationale: >
      /var/lib/mongodb, /var/lib/postgresql, /var/lib/kafka, /var/lib/etcd look like
      big folders to clean. Deleting files there corrupts the service.
    dangerous_actions:
      - {label: "delete in data dir", pattern: '(rm|delet\w*|remov\w*|clean\w*)\s+.{0,40}/var/lib/(mongo|postgres|mysql|kafka|etcd|docker)'}
      - {label: "docker prune", pattern: 'docker\s+(system|volume|image)\s+prune'}
